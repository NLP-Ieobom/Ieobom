services:
  backend:
    image: ${ECR_REGISTRY}/ieobom-backend:${IMAGE_TAG}
    container_name: ieobom-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=3).close()"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  db:
    image: pgvector/pgvector:0.8.7-pg17-bookworm
    container_name: ieobom-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - max_connections=30
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
    mem_limit: 1g
    shm_size: 256m
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  worker:
    image: ${ECR_REGISTRY}/ieobom-backend:${IMAGE_TAG}
    container_name: ieobom-worker
    restart: unless-stopped
    command: ["python", "-m", "app.worker.run", "analyze"]
    depends_on:
      backend:
        condition: service_healthy
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      WORKER_ID: question-worker

  extractor:
    image: ${ECR_REGISTRY}/ieobom-backend:${IMAGE_TAG}
    container_name: ieobom-extractor
    restart: unless-stopped
    command: ["python", "-m", "app.worker.run", "extract"]
    depends_on:
      backend:
        condition: service_healthy
      worker:
        condition: service_started
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      WORKER_ID: extraction-worker
    # docker.sock을 공유해서 host의 docling 이미지를 실행한다.
    # bind mount 경로는 host 기준이라 워커 자신도 같은 호스트 디렉터리를 입출력 경로로 마운트해 둔다.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./docling/input:/work/input
      - ./docling/output:/work/output

  # 워커와 같은 버전의 추출 코드를 별도 CPU 이미지에서 실행한다.
  docling:
    image: ieobom-docling:local
    build:
      context: ./docling
      dockerfile: Dockerfile.docling
      args:
        BACKEND_IMAGE: ${ECR_REGISTRY}/ieobom-backend:${IMAGE_TAG}
    profiles: ["tools"]
    init: true
    cpus: "1.0"
    mem_limit: 4g
    memswap_limit: 4g
    environment:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      EASYOCR_MODULE_PATH: /root/.cache/easyocr
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./docling/input:/work/input:ro
      - ./docling/output:/work/output
      - docling_cache:/root/.cache

volumes:
  postgres_data:
  docling_cache:
